[project]
name = "pictoria"
version = "0.1.0"
description = "Your Personal Image Gallery"
authors = [{ name = "Jannchie", email = "jannchie@gmail.com" }]
dependencies = [
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "openai>=2.36.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=5.8.0",
    "pillow-avif-plugin>=1.5.5",
    "python-dotenv>=1.2.2",
    "scikit-image>=0.26.0",
    "accelerate>=1.13.0",
    "arthash>=0.2.0",
    "silva-scorer>=0.2.0",
    "gallery-dl>=1.32.1",
    "cairnq==0.15.1",
    "onnxruntime>=1.29.0",
    "pyarrow>=19",
    "timm>=1.0.30",
]

requires-python = ">=3.11"

[[tool.uv.index]]
name = "default"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "ruff>=0.15.12",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # Only server/scripts/ open the library DB (inspect_db, backup_db, listwise_retest);
    # the worker never does, so the extension is not a runtime dependency.
    "sqlite-vec>=0.1.6",
]

[tool.pytest.ini_options]
# Tests import the backend packages from src/ (the same layout worker/main.py runs with).
pythonpath = ["src"]
testpaths = ["tests"]
# `asyncio_mode = auto` lets plain `async def test_*` run without per-test markers.
asyncio_mode = "auto"

[tool.pyright]
enabled = true
reportGeneralTypeIssues = true

[tool.ruff]
exclude = [".venv"]
line-length = 160

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "PGH",
    "RUF003",
    "BLE001",
    "ERA001",
    "FIX002",
    "TD002",
    "TD003",
    "D",
    "A004",
    "ANN201",
    "B008",
    "FAST002",
    "INP001",
    "CPY001",
]
# The worker never opens pictoria.sqlite -- all database writes happen in TS
# (CLAUDE.md, "the one rule"). Banning the module under src/ turns that rule
# from a convention into a lint error. scripts/ and tests/ are exempt below:
# one-off maintenance scripts open the library directly by design, and tests
# build throwaway SQLite fixtures.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlite3".msg = "src/ must not open SQLite: the worker computes, TS writes (see CLAUDE.md). One-off DB work belongs in scripts/."

[tool.ruff.lint.per-file-ignores]
"**/test/**/*" = ["S101"]
# pytest suite: asserts, magic values, missing annotations and private-member
# access are all idiomatic in tests; mock lambdas leave args unused (ARG),
# test exceptions use string literals (EM) and pass booleans positionally
# (FBT), and raw SQL in fixtures is intentional. Imports inside a test body
# (PLC0415) keep a heavy or optional dependency from failing collection of
# the whole file.
"tests/**/*" = [
    "PLC0415",
    "S101",
    "PLR2004",
    "ANN",
    "SLF001",
    "S608",
    "PLR0913",
    "ARG",
    "EM",
    "FBT",
    "TID251",
]
# CLI scripts: print is the output mechanism, ANN/DOC noise unhelpful here, and
# a one-off ``main`` reads top to bottom rather than splitting for C901.
"scripts/**/*" = [
    "C901",
    "T201",
    "T203",
    "ANN001",
    "ANN201",
    "ANN202",
    "S608",
    "PLR2004",
    "E402",
    "FBT003",
    "B007",
    "E501",
    "TC003",
    "TID251",
]

[tool.uv]
package = true
# upgrade = true
